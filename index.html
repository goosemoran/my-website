<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELLOTA BLANCA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="BELLOTA BLANCA: International content sales and rights trading. Chinese film, television and animation for Spain and Latin America.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout concept: a film-market sales sheet. Navy masthead and hero over an ivory catalogue floor;
   metadata set in mono like a market screener; gold only for rules, labels and the one primary action. */
:root{
  --navy:#102F4B; --gold:#C6A46A; --ivory:#F5F3EE; --char:#263746;
  --bg:#F5F3EE; --surface:#FBFAF6; --surface-2:#ECE8DD; --ink:#263746; --ink-soft:#56657A; --head:#102F4B;
  --rule:#D8D1C0; --gold-ink:#8A6824; --band:#102F4B; --band-ink:#F5F3EE; --band-soft:#B5C2CF;
  --field:#FFFFFF; --focus:#1B5E9B; --ok:#2F7D5B; --warn:#A5651D;
  --display:"Bodoni Moda","Noto Serif SC","Songti SC",Georgia,serif;
  --body:"Hanken Grotesk","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#091B2B; --surface:#0F2840; --surface-2:#133252; --ink:#DDE3E8; --ink-soft:#9DAAB8; --head:#F3EEE2;
    --rule:#244462; --gold-ink:#D6B67A; --band:#0A2238; --field:#0B2035; --focus:#7DB4E8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091B2B; --surface:#0F2840; --surface-2:#133252; --ink:#DDE3E8; --ink-soft:#9DAAB8; --head:#F3EEE2;
  --rule:#244462; --gold-ink:#D6B67A; --band:#0A2238; --field:#0B2035; --focus:#7DB4E8; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font:500 11.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.band .eyebrow,.hero .eyebrow{color:var(--gold)}
h1,h2,h3,h4{font-family:var(--display);color:var(--head);font-weight:700;margin:0;text-wrap:balance;line-height:1.12}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{font-weight:700;line-height:1.28}
h2{font-size:clamp(28px,3.6vw,44px);letter-spacing:-.01em}
h3{font-size:22px}
p{margin:0}
.lede{font-size:18px;color:var(--ink-soft);max-width:62ch}
.sec{padding-block:76px}
.sec.tint{background:var(--surface-2)}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:36px;max-width:780px}
.sec-head.row{max-width:none;flex-direction:row;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.band{background:var(--band);color:var(--band-ink)}
.band h2,.band h3{color:var(--band-ink)}
.band .lede,.band p{color:var(--band-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--head);background:transparent;color:var(--head);padding:12px 20px;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--head);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0B2236}
.btn.gold:hover{background:#D8B97C;border-color:#D8B97C;color:#0B2236}
.band .btn,.hero .btn{border-color:var(--band-ink);color:var(--band-ink)}
.band .btn:hover,.hero .btn:hover{background:var(--band-ink);color:var(--navy)}
.band .btn.gold,.hero .btn.gold{border-color:var(--gold);color:#0B2236;background:var(--gold)}
.btn.sm{padding:9px 14px;font-size:11.5px}
.link{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--gold);color:inherit}

/* header */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--band);color:var(--band-ink);border-bottom:1px solid rgba(198,164,106,.35)}
.mast-top{display:flex;align-items:center;gap:20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;background:none;border:0;padding:0;text-align:left;color:var(--band-ink)}
.brand img{width:54px;height:54px;flex:none;display:block}
.brand b{display:block;font:700 19px/1 var(--display);letter-spacing:.14em}
.brand small{display:block;font:500 9.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:5px}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:18px}
.lang{display:flex;border:1px solid rgba(245,243,238,.35);border-radius:2px}
.lang button{background:none;border:0;padding:7px 11px;font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--band-soft)}
.lang button[aria-pressed="true"]{background:var(--band-ink);color:var(--navy)}
.mast .contact-link{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--band-ink);background:none;border:0;padding:0}
.mast .contact-link:hover{color:var(--gold)}
.burger{display:none;background:none;border:1px solid rgba(245,243,238,.35);color:var(--band-ink);width:42px;height:38px;border-radius:2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(245,243,238,.12)}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 14px;font:500 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--band-soft);white-space:nowrap}
.nav button:hover{color:var(--band-ink)}
.nav button[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--gold)}

/* hero */
.hero{background:var(--navy);color:var(--ivory);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-block:64px 56px}
.hero h1{color:var(--ivory);font-size:clamp(38px,5.4vw,76px);letter-spacing:-.015em;line-height:1.04}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){color:var(--gold)}
:lang(zh) .hero h1{font-size:clamp(34px,4.6vw,62px)}
.hero .sub{font:500 13px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:26px 0 14px}
.hero p.intro{font-size:18px;color:#C9D3DC;max-width:54ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:600px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.wall .col{display:flex;flex-direction:column;gap:12px;animation:up 70s linear infinite}
.wall .col:nth-child(2){animation-name:down;animation-duration:85s}
.wall .col:nth-child(3){animation-duration:78s}
.wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px;background:#16324D}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.route{border-top:1px solid rgba(198,164,106,.35);background:rgba(0,0,0,.18)}
.route-in{display:flex;align-items:center;gap:20px 36px;flex-wrap:wrap;padding-block:18px}
.route .path{font:500 12px/1 var(--mono);letter-spacing:.18em;color:var(--gold)}
.route .terr{display:flex;gap:8px 14px;flex-wrap:wrap;font:400 12px/1 var(--mono);letter-spacing:.1em;color:#B5C2CF}
.route .terr b{font-weight:500;color:var(--ivory)}
.route .tot{margin-left:auto;font:400 12px/1.2 var(--mono);color:#B5C2CF;letter-spacing:.06em}

/* home blocks */
.who{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule)}
.facts div{padding:18px 0;border-bottom:1px solid var(--rule)}
.facts div:nth-child(odd){padding-right:18px;border-right:1px solid var(--rule)}
.facts div:nth-child(even){padding-left:22px}
.facts b{display:block;font:700 32px/1.1 var(--display);color:var(--head)}
.facts span{font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.biz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--head)}
.biz article{padding:26px 28px 30px 0;display:flex;flex-direction:column;gap:12px}
.biz article+article{padding-left:28px;border-left:1px solid var(--rule)}
.biz .n{font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--gold-ink)}
.biz ul{margin:6px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-soft)}
.biz li{padding:6px 0;border-top:1px solid var(--rule)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--rule);padding:18px 18px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:128px;border-radius:2px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat .ct{font:700 19px/1.2 var(--display);color:var(--head)}
.cat .cn{margin-top:auto;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.cat.empty{opacity:.7;border-style:dashed}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.entry{background:var(--band);color:var(--band-ink);padding:28px;display:flex;flex-direction:column;gap:14px;border-radius:2px;border-top:3px solid var(--gold)}
.entry h3{color:var(--band-ink)}
.entry p{color:var(--band-soft);font-size:15px}
.entry .btn{margin-top:auto;align-self:flex-start}
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.partner{padding:24px 22px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.partner b{font:700 20px/1.2 var(--display);color:var(--head)}
.partner span{font-size:14px;color:var(--ink-soft)}
.partner em{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--gold-ink)}
.note{font:400 12.5px/1.55 var(--mono);color:var(--ink-soft);max-width:78ch}

/* cards & posters */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:26px 18px}
.grid.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;background:#16324D;border-radius:2px;overflow:hidden;box-shadow:0 1px 0 var(--rule),0 12px 24px -16px rgba(9,27,43,.6);transition:transform .2s,box-shadow .2s}
.card:hover .poster{transform:translateY(-4px);box-shadow:0 0 0 1px var(--gold),0 18px 28px -16px rgba(9,27,43,.7)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.sq{background:#0E2740}
.poster.sq::before{content:"";position:absolute;inset:-10px;background:var(--bgimg) center/cover;filter:blur(18px) saturate(1.2);opacity:.85}
.poster.sq img{position:relative;top:50%;transform:translateY(-50%);height:auto;aspect-ratio:1/1;object-fit:cover}
.art{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:linear-gradient(165deg,hsl(var(--h) 40% 25%),hsl(calc(var(--h) + 38) 48% 10%));color:#F5F3EE}
.art::after{content:"";position:absolute;inset:8px;border:1px solid rgba(198,164,106,.55);pointer-events:none}
.art i{font:500 9.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-style:normal}
.art b{font:700 clamp(17px,1.6vw,22px)/1.1 var(--display);text-wrap:balance;padding-inline:4px}
.art small{font:400 10px/1.3 var(--mono);letter-spacing:.06em;color:#C9D3DC}
.badge{position:absolute;left:8px;top:8px;z-index:2;background:var(--gold);color:#0B2236;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:2px}
.badge.prod{background:#F5F3EE}
.ctitle{font:700 17px/1.2 var(--display);color:var(--head);text-wrap:balance}
.csub{font:400 11.5px/1.5 var(--mono);color:var(--ink-soft);letter-spacing:.02em}
.csub b{font-weight:500;color:var(--ink)}

/* catalogue */
.filters{display:flex;flex-direction:column;gap:16px;padding-block:22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:9px 13px;font:500 11.5px/1 var(--mono);letter-spacing:.06em;border-radius:2px}
.tabs button[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--bg)}
.tabs button span{opacity:.6;margin-left:6px}
.ctrls{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(4,minmax(130px,1fr)) auto;gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;font:400 15px/1.3 var(--body);min-width:0;width:100%}
.fld textarea{min-height:104px;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-soft);opacity:.8}
.count{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink-soft);margin-bottom:18px}
.empty-state{padding:60px 0;text-align:center;color:var(--ink-soft)}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(5,16,27,.72);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--bg);color:var(--ink);width:min(1020px,100%);border-radius:2px;position:relative;border-top:3px solid var(--gold);margin:auto 0}
.panel .x{position:absolute;right:10px;top:10px;z-index:3;width:40px;height:40px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;font-size:20px;line-height:1}
.pan-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;padding:34px}
.pan-grid .poster{position:sticky;top:24px;max-width:300px}
.pan-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.pan-main h2{font-size:clamp(26px,3vw,38px);padding-right:44px}
.pan-sub{font:400 15px/1.4 var(--body);color:var(--ink-soft);margin-top:-6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 11px/1 var(--mono);letter-spacing:.06em;padding:6px 8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px}
.chip.g{border-color:var(--gold);color:var(--gold-ink)}
dl.spec{display:grid;grid-template-columns:150px minmax(0,1fr);margin:0;border-top:1px solid var(--rule)}
dl.spec dt,dl.spec dd{padding:10px 0;border-bottom:1px solid var(--rule);margin:0}
dl.spec dt{font:500 10.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding-top:12px}
dl.spec dd{font-size:15px}
.fine{font:400 12px/1.55 var(--mono);color:var(--ink-soft)}
.seasons{font:400 12.5px/1.7 var(--mono)}
.inq{border-top:1px solid var(--rule);padding-top:20px;margin-top:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--field);padding:8px 10px;font:400 13px/1 var(--body);border-radius:2px;cursor:pointer}
.checks input{width:auto;accent-color:var(--navy)}
.result{border:1px solid var(--gold);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px}
.result pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 13px/1.6 var(--mono);color:var(--ink);background:var(--field);padding:14px;border:1px solid var(--rule);max-height:260px;overflow:auto}
.err{color:var(--warn);font:500 12px/1.4 var(--mono)}

/* animation */
.studio{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:start;padding-block:12px 28px}
.facts-line{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:22px 0}
.facts-line div{padding:14px 22px 14px 0;margin-right:22px;min-width:120px}
.facts-line b{display:block;font:700 24px/1.1 var(--display);color:var(--head)}
.facts-line span{font:500 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px}
.gallery img:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;height:100%}
.heroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.heroes figure{margin:0;background:#fff;border-radius:2px;padding:6px 4px 8px;text-align:center}
.heroes img{aspect-ratio:3/4;object-fit:contain;width:100%}
.heroes figcaption{font:500 9.5px/1.2 var(--mono);letter-spacing:.06em;color:#263746;text-transform:uppercase;margin-top:6px}
.focus{display:flex;flex-wrap:wrap;gap:8px}

/* network */
.map{border:1px solid var(--rule);background:var(--surface);padding:26px 22px 22px}
.map svg{width:100%;height:auto;display:block}
.regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--head);margin-top:30px}
.region{padding:22px 24px 26px 0;display:flex;flex-direction:column;gap:14px}
.region+.region{padding-left:24px;border-left:1px solid var(--rule)}
.mk{display:flex;flex-wrap:wrap;gap:6px}
.mk span{font:500 12px/1 var(--mono);padding:8px 10px;border:1px dashed var(--ink-soft);color:var(--ink);border-radius:2px}
.mk span.live{border:1px solid var(--gold);border-style:solid;background:var(--gold);color:#0B2236}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font:400 12px/1 var(--mono);color:var(--ink-soft)}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-3px;margin-right:8px;border-radius:2px}

/* rights */
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--head)}
.mod{padding:24px 24px 26px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.mod:not(:nth-child(3n+1)){padding-left:24px;border-left:1px solid var(--rule)}
.mod h3{font-size:19px}
.mod p{font-size:15px;color:var(--ink-soft)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.step{padding:22px 18px 4px 0;border-top:2px solid var(--gold);display:flex;flex-direction:column;gap:8px}
.step:not(:first-child){padding-left:18px;border-left:1px solid rgba(245,243,238,.18)}
.step b{font:700 18px/1.2 var(--display);color:var(--ivory)}
.step .n{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--gold)}
.step p{font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.list{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.list li{padding:12px 0;border-top:1px solid var(--rule);font-size:15.5px}
.list li b{font-family:var(--display);color:var(--head);font-weight:700}

/* about / contact */
.tl{display:grid;gap:0;border-top:1px solid var(--rule)}
.tl div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.tl b{font:500 13px/1.5 var(--mono);color:var(--gold-ink)}
.people{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.cform{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr);gap:56px;align-items:start}
.addr{display:flex;flex-direction:column;gap:18px;border-top:2px solid var(--head);padding-top:20px}
.addr div b{display:block;font:500 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.addr .sel{user-select:all}

/* footer */
.foot{background:var(--navy);color:#B5C2CF;padding-block:48px 36px;margin-top:0}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:40px}
.foot h4{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.foot a,.foot button.fl{color:#DDE3E8;text-decoration:none;background:none;border:0;padding:0;display:block;margin-bottom:10px;font-size:14px;text-align:left}
.foot a:hover,.foot button.fl:hover{color:var(--gold)}
.foot .tag{font:italic 500 20px/1.3 var(--display);color:var(--ivory);max-width:30ch}
.foot .fine{color:#8CA0B3;margin-top:36px;border-top:1px solid rgba(245,243,238,.14);padding-top:18px}


/* turn-2 additions */
.blband{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:40px;border:1px solid var(--rule);background:var(--surface);padding:32px 36px;border-radius:2px;align-items:start}
.blpts{display:grid;gap:18px}
.blpts h4{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:5px}
.blpts p{font-size:14.5px;color:var(--ink-soft)}

.cline{display:flex;gap:8px 22px;flex-wrap:wrap;font:500 14px/1.5 var(--mono)}
.cline a{color:var(--gold-ink);text-decoration:underline;text-underline-offset:3px}
.cline span{color:var(--ink-soft)}
.cline.on-dark a{color:var(--gold)}
.vband{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:center;border:1px solid var(--rule);background:var(--surface);padding:34px 38px;border-radius:2px}
.vband .big b{display:block;font:700 56px/1 var(--display);color:var(--head)}
.vband .big span{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.want{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px;align-items:center}
.want-box{border:1px solid rgba(245,243,238,.24);padding:28px;border-radius:2px}
.flag{display:grid;grid-template-columns:210px minmax(0,1fr);gap:44px;align-items:center}
.flag-poster{max-width:210px;width:100%}
.feat-mecha{flex-direction:row;gap:28px;align-items:center;width:100%;padding:24px;border:1px solid var(--rule);background:var(--surface);border-radius:2px}
.feat-mecha .fm-poster{width:150px;flex:none}
.animhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.animhero img{width:100%;border-radius:2px;aspect-ratio:4/3;object-fit:cover}
.mh-grid{display:grid;grid-template-columns:minmax(0,1.2fr) 280px;gap:56px;align-items:center}
.mhero{padding-block:64px}
.mhero h1{font:700 clamp(42px,6vw,76px)/.98 var(--display);color:var(--band-ink);letter-spacing:-.01em}
.mhero h1 span{color:var(--gold);font-size:.55em;letter-spacing:.14em}
.mhero .lede{color:var(--band-soft)}
.mh-poster{max-width:280px;width:100%;justify-self:end}
.hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:34px}
.hcard{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;border:1px solid var(--rule);padding:16px;background:var(--surface);border-radius:2px}
.hcard .himg{background:#fff;border-radius:2px;display:flex;align-items:center;justify-content:center;padding:6px;align-self:start}
.hcard img{width:100%;aspect-ratio:3/4;object-fit:contain}
.hcard .himg.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hcard .hno{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.hcard h3{font-size:22px;margin-top:6px}
.hcard p{font-size:14.5px;color:var(--ink-soft)}
.tbl-wrap{overflow-x:auto;border-top:2px solid var(--head)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
.tbl th{font:500 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:12px 10px;border-bottom:1px solid var(--rule)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.mods.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mods.m4 .mod:not(:nth-child(3n+1)){padding-left:0;border-left:0}
.mods.m4 .mod:not(:nth-child(4n+1)){padding-left:24px;border-left:1px solid var(--rule)}
.three.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.nav button[data-go="mechasia"]{color:var(--gold)}
.nav button[data-go="mechasia"][aria-current="page"]{color:var(--band-ink)}

@media (max-width:1020px){
  .hero-grid{grid-template-columns:1fr;gap:32px;padding-block:44px 36px}
  .wall{height:360px}
  .who,.studio,.cform,.people{grid-template-columns:1fr;gap:32px}
  .ctrls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctrls .fld:first-child{grid-column:1/-1}
  .grid.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 0}
  .step:nth-child(odd){padding-left:0;border-left:0}
  .step:nth-child(even){padding-left:18px;border-left:1px solid rgba(245,243,238,.18)}
  .step:last-child{grid-column:1/-1;padding-left:0;border-left:0}
  .heroes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .blband,.vband,.want,.flag,.animhero,.mh-grid{grid-template-columns:1fr;gap:28px}
  .mh-poster{justify-self:start;max-width:220px}
  .hcards{grid-template-columns:1fr}
  .mods.m4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mods.m4 .mod:not(:nth-child(4n+1)),.mods.m4 .mod:not(:nth-child(3n+1)){padding-left:0;border-left:0}
  .mods.m4 .mod:nth-child(even){padding-left:24px;border-left:1px solid var(--rule)}
}
@media (max-width:760px){
  .sec{padding-block:52px}
  .burger{display:block}
  .mast-right .contact-link{display:none}
  .mast-right{gap:10px}
  .mast-right .btn{display:none}
  .nav{display:none;flex-direction:column;border-top:1px solid rgba(245,243,238,.2);padding-block:6px}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:14px 4px;border-bottom:1px solid rgba(245,243,238,.1)}
  .brand small{display:none}
  .biz,.three,.mods,.regions,.two,.list,.foot-grid{grid-template-columns:1fr}
  .biz article,.biz article+article{padding:22px 0;border-left:0;border-top:1px solid var(--rule)}
  .mod,.mod:not(:nth-child(3n+1)){padding:20px 0;border-left:0}
  .region,.region+.region{padding:20px 0;border-left:0;border-top:1px solid var(--rule)}
  .facts{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  .grid.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pan-grid{grid-template-columns:1fr;padding:22px 16px}
  .pan-grid .poster{position:relative;top:0;max-width:210px}
  dl.spec{grid-template-columns:112px minmax(0,1fr)}
  .form{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery img:first-child{grid-column:span 2;grid-row:auto;aspect-ratio:16/9}
  .heroes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tl div{grid-template-columns:84px minmax(0,1fr);gap:12px}
  .route .tot{margin-left:0}
  .steps{grid-template-columns:1fr}
  .step,.step:not(:first-child),.step:nth-child(even){padding:18px 0 4px;border-left:0}
  .step:last-child{grid-column:auto}
  .vband,.blband{padding:24px 20px}
  .vband .big b{font-size:44px}
  .mods.m4,.three.t2{grid-template-columns:1fr}
  .mods.m4 .mod,.mods.m4 .mod:nth-child(even){padding:20px 0;border-left:0}
  .hcard{grid-template-columns:120px minmax(0,1fr);gap:14px}
  .feat-mecha{flex-direction:column;align-items:flex-start;padding:18px}
  .feat-mecha .fm-poster{width:140px}
  .mhero{padding-block:44px}
  .flag-poster{max-width:160px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .wall .col{animation:none}
  .card:hover .poster,.cat:hover{transform:none}
}

  repeating-linear-gradient(135deg,var(--tintline) 0 1px,transparent 1px 16px),

  border-block:1px solid var(--rule)}
main>.sec:first-child:not(.band){background:

.band{position:relative;overflow:hidden;background:

.hero{background:
  radial-gradient(920px 540px at 80% 34%,rgba(198,164,106,.22),transparent 62%),
  radial-gradient(720px 520px at 6% 112%,rgba(27,94,155,.40),transparent 62%),
  repeating-linear-gradient(90deg,rgba(245,243,238,.035) 0 1px,transparent 1px 112px),
  linear-gradient(160deg,#0E2B45 0%,var(--navy) 55%,#0A2238 100%)}
.hero::after{content:"";position:absolute;left:-130px;bottom:-170px;width:520px;height:520px;background:url(img/logo.png) center/contain no-repeat;opacity:.05;pointer-events:none}
.hero>*{position:relative;z-index:1}
.foot{background:
  radial-gradient(600px 300px at 90% 0,rgba(198,164,106,.12),transparent 65%),

.mhero{background:
  radial-gradient(700px 520px at 82% 40%,rgba(27,94,155,.55),transparent 62%),
  radial-gradient(640px 400px at 12% -8%,rgba(198,164,106,.22),transparent 62%),
  repeating-linear-gradient(90deg,rgba(245,243,238,.04) 0 1px,transparent 1px 96px),
  repeating-linear-gradient(0deg,rgba(245,243,238,.025) 0 1px,transparent 1px 96px),

const LOGO=`<img src="img/logo.png" alt="" width="54" height="54">`;
function poster(it,opts={}){
  const own=it.lic==="own";
  const badge=it.status==="prod"?`<span class="badge prod">${esc(st("prod"))}</span>`:own?`<span class="badge">${esc(i("Own production","Producción propia","自有制作"))}</span>`:"";
  if(it.img){
    const sq=it.sq?` sq" style="--bgimg:url('${it.img}')`:"";
    return `<div class="poster${sq}">${badge}<img src="${it.img}" alt="${esc(title1(it))}" loading="${opts.eager?"eager":"lazy"}" decoding="async"></div>`;
  }
  const h=(it.id.split("").reduce((a,c)=>a+c.charCodeAt(0),0)*37)%360;
  const kind=it.cats[0]==="short"?"VERTICAL · 9:16":it.cats[0]==="drama"?"BL SERIES":"TITLE";
  return `<div class="poster"><div class="art" style="--h:${h}"><i>${kind}</i><b>${esc(title1(it))}</b><small>${esc((it.genres||[]).slice(0,2).map(gen).join(" · "))}</small></div>${badge}</div>`;
}
function metaLine(it){
  const bits=[];
  if(it.year)bits.push(`<b>${esc(it.year)}</b>`);
  const e=it.eps?pick(it.eps):"";
  if(e)bits.push(esc(e));
  if(it.run&&!/total/.test(it.run)&&!e.includes("30"))bits.push(esc(it.run));
  return bits.join(" · ");
}
function card(it){
  return `<button class="card" data-open="${it.id}" aria-label="${esc(title1(it))}">${poster(it)}

}

function filtered(){
  const q=F.q.trim().toLowerCase();

function formFields(kind,preset={}){
  const rights=["free","pay","svod","avod","fast","digital","format","remake","license"].map(k=>`<label><input type="checkbox" name="rights" value="${k}"${(preset.rights||[]).includes(k)?" checked":""}>${esc(rt(k))}</label>`).join("");
  const plat=[[i("Broadcaster","Cadena de TV","电视台"),"Broadcaster"],[i("Streaming platform","Plataforma de streaming","流媒体平台"),"Streaming"],[i("Distributor","Distribuidor","发行商"),"Distributor"],[i("FAST / AVOD","FAST / AVOD","FAST / AVOD"),"FAST/AVOD"],[i("Other","Otro","其他"),"Other"]].map(p=>`<label><input type="checkbox" name="platform" value="${p[1]}">${p[0]}</label>`).join("");
  const f=(id,label,type="text",req=false,full=false,val="")=>`<div class="fld${full?" full":""}"><label for="${id}">${label}${req?" *":""}</label>${type==="textarea"?`<textarea id="${id}" name="${id}"${req?" required":""}>${esc(val)}</textarea>`:`<input id="${id}" name="${id}" type="${type}"${req?" required":""} value="${esc(val)}" ${type==="email"?'autocomplete="email"':""}>`}</div>`;
  const common=f("q-name",i("Name","Nombre","姓名"),"text",true)+f("q-company",i("Company","Empresa","公司"),"text",true)+f("q-country",i("Country","País","国家"),"text",true)+f("q-email",i("Business email","Correo profesional","工作邮箱"),"email",true)+f("q-pos",i("Position","Cargo","职位"));
  if(kind==="submit")return common+f("q-title",i("Project title","Título del proyecto","项目名称"),"text",true)+f("q-info",i("Format, episodes, runtime","Formato, episodios, duración","类型、集数、时长"))+f("q-held",i("Rights you hold","Derechos que posee","您持有的权利"))+f("q-terr",i("Territories to offer","Territorios a ofrecer","可授权地区"))+f("q-link",i("Link to materials","Enlace a materiales","资料链接"),"text",false,true)+f("q-msg",i("Message","Mensaje","留言"),"textarea",false,true);
  if(kind==="partner")return common+f("q-type",i("Type of organisation","Tipo de organización","机构类型"),"text",false,true)+f("q-msg",i("How would you like to work together?","¿Cómo te gustaría colaborar?","希望如何合作？"),"textarea",true,true);
  return common+f("q-title",i("Interested project","Proyecto de interés","感兴趣的项目"),"text",false,true,preset.title||"")+`<div class="fld full"><label>${i("Rights required","Derechos requeridos","所需权利")}</label><div class="checks">${rights}</div></div>`+f("q-terr",i("Territory","Territorio","地区"),"text",false,false,preset.terr||"")+`<div class="fld"><label>${i("Platform","Plataforma","平台")}</label><div class="checks">${plat}</div></div>`+f("q-msg",i("Message","Mensaje","留言"),"textarea",false,true);
}

  const spec=[
    dd(i("Genre","Género","类型"),`<div class="chips">${(it.genres||[]).map(g=>`<span class="chip">${esc(gen(g))}</span>`).join("")}</div>`),
    dd(i("Country of origin","País de origen","制作国家"),esc(ctry(it.country))),

    it.year?dd(i("Year","Año","年份"),esc(it.year)):"",
    it.prem?dd(i("Premiere","Estreno","首播"),esc(pick(it.prem))):"",
    it.plat?dd(i("Broadcast platforms","Plataformas de emisión","播出平台"),esc(pick(it.plat))):"",

    it.eps?dd(i("Episodes","Episodios","集数"),esc(pick(it.eps))):"",
    it.run?dd(i("Running time","Duración","时长"),esc(it.run.replace("total",i("total","en total","合计")))):"",
    it.audience?dd(i("Audience","Público","受众"),esc(pick(it.audience))):"",
    dd(i("Original language","Idioma original","原语言"),esc(lg(it.langs))),
    dd(i("Available subtitles","Subtítulos disponibles","可提供字幕"),it.subs?esc(pick(it.subs)):esc(i("Spanish / English on request","Español / inglés bajo petición","西语 / 英语字幕按需提供"))),
    dd(i("Production status","Estado de producción","制作状态"),esc(st(it.status))),
    it.dir?dd(i("Director","Director","导演"),esc(it.dir)):"",
    it.cast?dd(i("Cast","Reparto","主演"),esc(it.cast)):"",
    it.seasons?dd(i("Seasons","Temporadas","季数"),`<div class="seasons">${esc(it.seasons)}</div>`):"",
    dd(i("Rights available","Derechos disponibles","可授权权利"),rights.length?`<div class="chips">${rights.map(r=>`<span class="chip g">${esc(rt(r))}</span>`).join("")}</div><p class="fine" style="margin-top:8px">${i("Scope and exclusivity confirmed per contract.","Alcance y exclusividad confirmados por contrato.","范围与独家性以合同确认。")}</p>`:esc(i("Available on request, confirmed per contract.","Disponible bajo petición, confirmado por contrato.","可洽谈，以合同确认。"))),
    dd(i("Available territories","Territorios disponibles","可授权地区"),esc(terr(it.terr))),
  ].join("");
  const el=document.createElement("div");el.className="scrim";el.id="modal";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",title1(it));
  el.innerHTML=`<div class="panel"><button class="x" data-close aria-label="${i("Close","Cerrar","关闭")}">×</button><div class="pan-grid">${poster(it,{eager:true})}
   <div class="pan-main"><div><div class="eyebrow">${esc((it.cats||[]).map(catName).join(" · "))}</div><h2 style="margin-top:10px">${esc(title1(it))}</h2>${title2(it)?`<div class="pan-sub">${esc(title2(it))}</div>`:""}${it.sub?`<div class="pan-sub">${esc(pick(it.sub))}</div>`:""}</div>
   <div><div class="eyebrow" style="margin-bottom:6px">${i("Logline","Sinopsis breve","一句话简介")}</div><p style="font-size:17px">${esc(pick(it.lines))}</p></div>
   ${it.note?`<p style="color:var(--ink-soft)">${esc(pick(it.note))}</p>`:""}

   <div class="inq" id="inq" hidden>${formHTML("buy",{title:title1(it),terr:terr(it.terr),rights:rights.filter(r=>["svod","avod","fast","digital"].includes(r))})}</div></div></div></div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";

function openLegal(k){
  const names=[i("Privacy Policy","Política de privacidad","隐私政策"),i("Cookie Policy","Política de cookies","Cookie政策"),i("Legal Notice","Aviso legal","法律声明"),i("Terms of Use","Condiciones de uso","使用条款")];

/* ---------- inquiry submit ---------- */
function handleSubmit(form){
  const kind=form.dataset.kind;const out=form.querySelector("#inq-out");
  const fd=new FormData(form);const g=k=>(fd.get(k)||"").toString().trim();
  const req=[...form.querySelectorAll("[required]")].filter(x=>!x.value.trim());
  const email=g("q-email");
  if(req.length||(email&&!/^\S+@\S+\.\S+$/.test(email))){
    out.innerHTML=`<p class="err">${i("Please complete the required fields and use a valid email.","Completa los campos obligatorios e indica un correo válido.","请填写必填项并使用有效邮箱。")}</p>`;(req[0]||form.querySelector("#q-email")).focus();return;
  }
  const L=[];
  const head={buy:"Rights inquiry",submit:"Content submission",partner:"Partnership proposal"}[kind];
  L.push(`${head}${g("q-title")?" — "+g("q-title"):""}`,"");
  L.push(`Name: ${g("q-name")}`,`Company: ${g("q-company")}`,`Country: ${g("q-country")}`,`Email: ${email}`);
  if(g("q-pos"))L.push(`Position: ${g("q-pos")}`);
  if(kind==="buy"){const r=fd.getAll("rights").map(rt);const p=fd.getAll("platform");if(g("q-title"))L.push(`Interested project: ${g("q-title")}`);if(r.length)L.push(`Rights required: ${r.join(", ")}`);if(g("q-terr"))L.push(`Territory: ${g("q-terr")}`);if(p.length)L.push(`Platform: ${p.join(", ")}`)}
  if(kind==="submit"){["q-info","q-held","q-terr","q-link"].forEach((k,n)=>{if(g(k))L.push(`${["Format / episodes / runtime","Rights held","Territories to offer","Materials"][n]}: ${g(k)}`)})}
  if(kind==="partner"&&g("q-type"))L.push(`Organisation type: ${g("q-type")}`);
  if(g("q-msg"))L.push("","Message:",g("q-msg"));
  const body=L.join("\n");const subj=head+(g("q-title")?" — "+g("q-title"):"");
  out.innerHTML=`<div class="result"><b style="font-family:var(--display);font-size:20px">${i("Your inquiry is ready to send","Tu consulta está lista para enviar","您的询价已生成")}</b><p class="fine">${i("This preview site has no mail server, so nothing has been sent yet. Copy the message and email it to","Esta vista previa no tiene servidor de correo, así que todavía no se ha enviado nada. Copia el mensaje y envíalo a","此预览站没有邮件服务器，目前尚未发送任何内容。请复制下方内容并发送至")} <b>${MAIL}</b>.</p><pre id="inq-text">${esc(body)}</pre><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn sm gold" type="button" data-copy-pre>${i("Copy message","Copiar mensaje","复制内容")}</button><a class="btn sm" href="mailto:${MAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}">${i("Open in mail app","Abrir en correo","在邮件应用中打开")}</a></div></div>`;
  out.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent=i("Copied","Copiado","已复制");setTimeout(()=>btn.textContent=o,1600)}};
  const fb=()=>{try{const r=document.createRange();const p=$("#inq-text");if(p){r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}}catch(e){}};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}

/* ---------- render & events ---------- */
function setLang(l){lang=l;try{localStorage.setItem("bb-lang",l)}catch(e){}document.documentElement.lang=l==="zh"?"zh-CN":l;render()}
function go(v,scrollTop=true){if(!VIEWS.includes(v))v="home";view=v;if(location.hash.slice(1)!==v){location.hash=v}render();if(scrollTop)window.scrollTo({top:0,behavior:"instant"})}
function render(){
  document.documentElement.lang=lang==="zh"?"zh-CN":lang;
  const views={home:vHome,catalogue:vCatalogue,mechasia:vMechasia,rights:vRights,animation:vAnimation,network:vNetwork,coproduction:vCoprod,about:vAbout,contact:vContact};
  const open=$("#nav")&&$("#nav").classList.contains("open");
  $("#app").innerHTML=`<header class="mast"><div class="wrap"><div class="mast-top"><button class="brand" data-go="home" aria-label="BELLOTA BLANCA">${LOGO}<span><b>BELLOTA BLANCA</b><small>International Content Sales &amp; Rights Trading</small></span></button>
   <div class="mast-right"><div class="lang" role="group" aria-label="Language">${[["en","EN"],["es","ES"],["zh","中文"]].map(l=>`<button data-lang="${l[0]}" aria-pressed="${lang===l[0]}">${l[1]}</button>`).join("")}</div>
   <button class="contact-link" data-go="contact">${i("Contact sales","Contactar ventas","联系商务")}</button><button class="btn gold sm" data-go="catalogue">${i("Explore content","Explorar contenido","浏览内容")}</button>
   <button class="burger" id="burger" aria-label="Menu" aria-expanded="${!!open}">☰</button></div></div>
   <nav class="nav${open?" open":""}" id="nav" aria-label="Main">${VIEWS.map(v=>`<button data-go="${v}"${v===view?' aria-current="page"':""}>${nav(v)}</button>`).join("")}</nav></div></header>
   <main>${views[view]()}</main>${footer()}`;
  if(view==="catalogue")renderGrid();
  document.title="BELLOTA BLANCA";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-open],[data-mtab],[data-lang],[data-cat],[data-contact],[data-ctab],[data-close],[data-inq],[data-legal],[data-copy],[data-copy-pre],#burger,#f-reset,.scrim");
  if(!t)return;
  if(t.classList.contains("scrim")){if(e.target===t)closeModal();return}
  if(t.dataset.close!==undefined){closeModal();return}
  if(t.id==="burger"){$("#nav").classList.toggle("open");t.setAttribute("aria-expanded",$("#nav").classList.contains("open"));return}
  if(t.dataset.lang){setLang(t.dataset.lang);return}
  if(t.dataset.go){closeModal();$("#nav")&&$("#nav").classList.remove("open");go(t.dataset.go);return}
  if(t.dataset.open){openTitle(t.dataset.open);return}
  if(t.dataset.mtab){mtab=t.dataset.mtab;closeModal();if(view!=="mechasia"){go("mechasia")}else{render()}return}
  if(t.dataset.contact){closeModal();contactTab=t.dataset.contact;go("contact");return}
  if(t.dataset.ctab){contactTab=t.dataset.ctab;render();return}
  if(t.dataset.cat){F.cat=t.dataset.cat;closeModal();if(view!=="catalogue"){go("catalogue")}else{render()}return}
  if(t.dataset.inq!==undefined){const b=$("#inq");b.hidden=false;t.hidden=true;b.querySelector("input").focus();b.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(t.dataset.legal){openLegal(+t.dataset.legal);return}
  if(t.dataset.copy){copyText(t.dataset.copy,t);return}
  if(t.dataset.copyPre!==undefined){copyText($("#inq-text").textContent,t);return}
  if(t.id==="f-reset"){Object.assign(F,{q:"",cat:"all",genre:"all",terr:"all",status:"all",src:"all"});render();return}
});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){F.q=e.target.value;renderGrid()}});
document.addEventListener("change",e=>{const m={"f-g":"genre","f-t":"terr","f-s":"status","f-o":"src"}[e.target.id];if(m){F[m]=e.target.value;renderGrid()}});
document.addEventListener("submit",e=>{if(e.target.id==="inq-form"){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==view){view=v;render();window.scrollTo(0,0)}});
{const v=location.hash.slice(1);if(VIEWS.includes(v))view=v}
render();

</script>
